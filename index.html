<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0; url=/www.lahoremusichouse.in/index.html">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lahore Music House | Master Crafted Musical Instruments (Est. 1947)</title>
  <link rel="icon" href="catalog.wlimg.com/1/37946/other-images/782217.png" type="image/png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:wght@600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1b1638 0%, #0d0b1a 60%, #080711 100%);
      color: #fbfaff;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .launcher-card {
      background: rgba(18, 16, 36, 0.92);
      border: 1.5px solid rgba(180, 54, 226, 0.35);
      border-radius: 22px;
      padding: 50px 38px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 35px rgba(180, 54, 226, 0.25);
      animation: fadeIn 0.6s ease;
      backdrop-filter: blur(14px);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo-img {
      max-height: 80px;
      margin: 0 auto 20px;
      background: #ffffff;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1.5px solid #8257F1;
      box-shadow: 0 0 15px rgba(130, 87, 241, 0.35);
    }
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 1.85rem;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 8px;
      font-weight: 800;
    }
    .brand-title span {
      background: linear-gradient(135deg, #B436E2 0%, #8257F1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }
    .brand-subtitle {
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #9993bd;
      margin-bottom: 24px;
    }
    .status-text {
      font-size: 0.95rem;
      color: #d4cfeb;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .btn-enter {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #B436E2 0%, #8257F1 100%);
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 36px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 6px 25px rgba(180, 54, 226, 0.45);
    }
    .btn-enter:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(180, 54, 226, 0.65);
      background: linear-gradient(135deg, #c84bf4 0%, #966ff5 100%);
    }
    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(180, 54, 226, 0.2);
      border-top-color: #B436E2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 22px auto 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    // Smooth immediate redirection
    window.location.replace("/www.lahoremusichouse.in/index.html");
  </script>
</head>
<body>
  <div class="launcher-card">
    <img src="catalog.wlimg.com/1/37946/other-images/12428-comp-image.png" alt="Lahore Music House Logo" class="logo-img">
    <h1 class="brand-title">Lahore <span>Music</span> House</h1>
    <p class="brand-subtitle">Established 1947 · Darya Ganj, Delhi</p>
    <p class="status-text">Redirecting to the master catalog and showroom...</p>
    <a href="/www.lahoremusichouse.in/index.html" class="btn-enter">
      Enter Lahore Music House &rarr;
    </a>
    <div class="spinner"></div>
  </div>
</body>
</html>
